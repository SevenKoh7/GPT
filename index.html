<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee7da"><title>一罐晴天</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;color:#514c43;background:#eee8dc}button,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}main{height:100dvh;position:relative;isolation:isolate;background:radial-gradient(ellipse at 15% 0%,#fffdf3 0,transparent 60%)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:-1}header{position:absolute;top:max(30px,env(safe-area-inset-top));left:8%;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:4px;color:#8d887a}h1{font-family:serif;font-weight:400;font-size:32px;letter-spacing:5px;margin:15px 0 10px}header p{font-size:12px;letter-spacing:2px;color:#928b7c;line-height:1.9}.sound{position:absolute;top:38px;right:7%;border:1px solid #fff9;background:#ffffff40;border-radius:50%;width:42px;height:42px;color:#777063;box-shadow:0 3px 0 #cfc6b7;font-size:17px}.bottom{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));left:0;width:100%;text-align:center}.count{font-size:11px;letter-spacing:3px;color:#8b8272;margin-bottom:22px}.actions{display:flex;gap:14px;justify-content:center}button.solid{border:1px solid #ffffff90;border-radius:17px;padding:16px 24px;color:#fffef7;background:linear-gradient(#858f79,#6f7c65);box-shadow:0 5px 0 #536149,0 9px 16px #5c65451c;transition:transform .15s,box-shadow .15s}button.secondary{background:linear-gradient(#faf7ee,#e9e2d5);color:#756c5a;box-shadow:0 5px 0 #c8beac,0 9px 16px #66502a12}button:active{transform:translateY(4px)!important;box-shadow:0 1px 0 #b1aa98!important}button:disabled{opacity:.5;cursor:default}.hint{margin:22px 0 0;font-size:10px;letter-spacing:2px;color:#a19887}.overlay{position:fixed;inset:0;background:#514a3a38;backdrop-filter:blur(9px);display:grid;place-items:center;padding:22px;z-index:3}.overlay[hidden]{display:none}.card{position:relative;width:min(390px,100%);padding:30px 26px;background:linear-gradient(140deg,#fffdf6,#f1ebdd);border:1px solid #fff9;border-radius:26px;box-shadow:0 25px 90px #443a3233;text-align:center;animation:appear .35s cubic-bezier(.2,.8,.2,1)}@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.96)}}.close{position:absolute;right:14px;top:12px;background:none;border:0;color:#928875;font-size:24px}.card h2{font-family:serif;font-size:23px;font-weight:400;letter-spacing:3px}.sub{font-size:11px;color:#9b907e;line-height:1.9}textarea{width:100%;height:115px;resize:none;border:1px solid #dcd3c3;border-radius:12px;background:#fffcf580;padding:15px;color:#625849;outline:none;line-height:1.8;margin:15px 0}textarea:focus{border-color:#a6ad95}.palette{display:flex;justify-content:center;gap:14px;margin:8px 0 25px}.swatch{width:25px;height:25px;border:3px solid #fff9;border-radius:50%;box-shadow:0 2px 3px #0001}.swatch[aria-pressed=true]{outline:1px solid #807765;outline-offset:3px}.paper{padding:25px 15px;margin:20px 0;background:#fffdf5;box-shadow:0 3px 12px #66512a12;transform:rotate(-2deg);font-family:serif;line-height:2;overflow-wrap:anywhere;max-height:32dvh;overflow:auto}.date{font:10px sans-serif;color:#a49881;letter-spacing:2px;margin-top:18px}.tiny{border:0;background:none;color:#968a75;font-size:12px;margin-top:20px}.toast{position:fixed;bottom:170px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#fffaf0ed;border-radius:20px;color:#82735f;font-size:12px;box-shadow:0 4px 20px #0001;z-index:5;max-width:90%;text-align:center}.toast[hidden]{display:none}@media(min-width:700px){header{top:9%;left:12%}h1{font-size:40px}.bottom{bottom:7%}}@media(max-height:650px){header{top:18px}h1{font-size:25px;margin:8px 0}header p{margin:0}.bottom{bottom:18px}.count{margin-bottom:12px}.hint{margin-top:15px}}
</style></head><body><main><canvas id="scene" aria-label="桌面上的玻璃糖罐，可以拖动旋转"></canvas><header><div class="eyebrow">LITTLE THINGS, KEPT.</div><h1>一罐晴天</h1><p>把日子里的那一点甜，<br>留给需要的时候。</p></header><button class="sound" id="motion" aria-label="启用手机倾斜感应" title="启用手机倾斜感应">⌁</button><div class="bottom"><div class="count" id="count"></div><div class="actions"><button class="solid" id="add">＋ 放一颗糖</button><button class="solid secondary" id="take">取一颗，慢慢吃</button></div><p class="hint">轻轻拖动糖罐 · 让光换一个方向</p></div></main>
<div class="overlay" id="compose" hidden><form class="card" id="form"><button type="button" class="close" aria-label="关闭">×</button><div class="eyebrow">A SMALL GOOD THING</div><h2>今天，有什么甜？</h2><div class="sub">再小的开心，也值得包起来。</div><textarea id="note" maxlength="300" placeholder="比如，回家的时候，风刚刚好。" required aria-label="今天开心的一件事"></textarea><div class="palette" id="palette" aria-label="糖纸颜色"></div><button class="solid" type="submit">包好，放进罐子</button><p class="sub">只存在这台设备的浏览器里</p></form></div>
<div class="overlay" id="unwrap" hidden><div class="card"><button class="close" aria-label="放回罐子">×</button><div class="eyebrow" id="unwrapLabel">SOMETHING SWEET FOR YOU</div><div id="wrapped"><h2>有一颗开心，等着你。</h2><div style="font-size:65px;margin:28px 0" aria-hidden="true">🍬</div><button class="solid" id="openCandy">轻轻拆开糖纸</button></div><div id="opened" hidden><h2>那一天的你说：</h2><div class="paper"><div id="memory"></div><div class="date" id="date"></div></div><button class="solid" id="eat">吃掉这颗甜</button><div class="sub" style="margin-top:16px">吃掉后，这颗糖和纸条就不再保留。</div></div><br><button class="tiny" id="return">还舍不得，放回去</button></div></div><div class="toast" id="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), colors=['#e99b9a','#e4ba64','#8fbfa8','#9baad3','#bea0cc'];let selected=0,candies=[],held=null,rotation=.15,tilt=0,fall=0,storageOK=true;const key='little-sunshine-candies-v1';
try{let raw=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(raw)||!raw.every(c=>c&&typeof c.id==='string'&&typeof c.text==='string'&&typeof c.date==='string'&&colors.includes(c.color)))throw Error();candies=raw;}catch(e){storageOK=false;}
let toastTimer;function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4200)}function save(next){try{localStorage.setItem(key,JSON.stringify(next));candies=next;refresh();return true}catch(e){toast('浏览器没有允许保存。请开启本地存储后再试，糖还在这里。');return false}}function refresh(){$('count').textContent=candies.length?'罐子里，藏着 '+candies.length+' 颗小开心':'空罐子，等一件小小的好事';$('take').disabled=!candies.length}refresh();if(!storageOK)toast('本地存储无法读取；暂时不要放糖，以免覆盖原来的回忆。');$('add').disabled=!storageOK;
colors.forEach((c,i)=>{let b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=c;b.setAttribute('aria-label',['桃粉','蜜黄','薄荷','雾蓝','浅紫'][i]);b.setAttribute('aria-pressed',i===selected);b.onclick=()=>{selected=i;[...$('palette').children].forEach((el,n)=>el.setAttribute('aria-pressed',n===i))};$('palette').append(b)});
function hide(id){$(id).hidden=true;$(id==='compose'?'add':'take').focus()}$('add').onclick=()=>{$('compose').hidden=false;setTimeout(()=>$('note').focus(),80)};$('compose').querySelector('.close').onclick=()=>hide('compose');$('form').onsubmit=e=>{e.preventDefault();let text=$('note').value.trim();if(!text){$('note').focus();return}if(save([...candies,{id:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),text,date:new Date().toISOString(),color:colors[selected]}])){$('note').value='';hide('compose');fall=1;toast('收好了。今天的甜，有了住处。')}};
$('take').onclick=()=>{if(!candies.length)return;held=candies[Math.floor(Math.random()*candies.length)];$('wrapped').hidden=false;$('opened').hidden=true;$('unwrap').hidden=false;$('openCandy').focus()};$('openCandy').onclick=()=>{$('wrapped').hidden=true;$('opened').hidden=false;$('memory').textContent=held.text;const d=new Date(held.date);$('date').textContent=isNaN(d)?'某个开心的日子':d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});$('eat').focus()};function putBack(){held=null;hide('unwrap')}$('return').onclick=putBack;$('unwrap').querySelector('.close').onclick=putBack;$('eat').onclick=()=>{if(held&&save(candies.filter(c=>c.id!==held.id))){held=null;hide('unwrap');toast('那一点甜，现在在你心里了。')}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('compose').hidden)hide('compose');if(!$('unwrap').hidden)putBack()}if(e.key==='Tab'){const modal=[ $('compose'),$('unwrap')].find(x=>!x.hidden);if(!modal)return;const els=[...modal.querySelectorAll('button,textarea')].filter(x=>x.getClientRects().length&&!x.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});window.addEventListener('storage',e=>{if(e.key===key){toast('糖罐在另一个窗口有了变化，请刷新后继续。');$('add').disabled=true;$('take').disabled=true;$('eat').disabled=true}});
$('motion').onclick=async()=>{try{if(!window.DeviceOrientationEvent){toast('这台设备没有倾斜感应，可以用手拖动糖罐。');return}if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted'){toast('未开启倾斜权限，仍然可以拖动。');return}window.addEventListener('deviceorientation',e=>{if(e.gamma!==null){tilt=Math.max(-1,Math.min(1,e.gamma/35));rotation=tilt*.7}},{passive:true});toast('轻轻倾斜手机，让光慢慢移动。')}catch(e){toast('倾斜感应需要浏览器支持与安全连接；你也可以拖动。')}};
const canvas=$('scene'),ctx=canvas.getContext('2d');let W,H,dpr,drag=false,lastX=0;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();canvas.onpointerdown=e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){rotation+=(e.clientX-lastX)*.008;tilt=Math.sin(rotation)*.8;lastX=e.clientX}};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;
function ellipse(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}function candy(x,y,color,angle,s){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(s,s);ctx.fillStyle=color;ctx.globalAlpha=.7;for(let dir of [-1,1]){ctx.beginPath();ctx.moveTo(dir*12,0);ctx.lineTo(dir*25,-12);ctx.lineTo(dir*23,10);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffff80';ctx.stroke()}ctx.globalAlpha=.95;let g=ctx.createLinearGradient(-10,-10,12,12);g.addColorStop(0,'#fff5');g.addColorStop(.35,color);g.addColorStop(1,color);ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-15,-11,30,22,8);ctx.fill();ctx.strokeStyle='#fff9';ctx.stroke();ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(7,-7);ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const scale=Math.min(W/390,H/760,1.23),cx=W*.5,cy=H*.48+30*scale;ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
// Slanted afternoon light and the quiet edge of the table.
let light=ctx.createLinearGradient(-230,-350,210,200);light.addColorStop(0,'#fffdf9aa');light.addColorStop(1,'#fffbea00');ctx.fillStyle=light;ctx.beginPath();ctx.moveTo(-480,-430);ctx.lineTo(-110,-430);ctx.lineTo(470,240);ctx.lineTo(60,250);ctx.fill();ctx.strokeStyle='#b9ac9210';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-270,-340);ctx.lineTo(260,215);ctx.stroke();
ctx.save();ctx.translate(35+tilt*20,131);ctx.rotate(-.12);let shadow=ctx.createRadialGradient(0,0,10,0,0,145);shadow.addColorStop(0,'#62563d25');shadow.addColorStop(1,'#62563d00');ellipse(0,0,160,36,shadow);ctx.restore();
const visible=candies.slice(-65);visible.forEach((c,i)=>{let a=i*2.399+rotation,x=Math.sin(a)*(25+(i%5)*13),y=76-Math.floor(i/7)*23;ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.22;let gx=x+70+tilt*45,gy=147+(i%4)*9;let g=ctx.createRadialGradient(gx,gy,1,gx,gy,47);g.addColorStop(0,c.color);g.addColorStop(1,c.color+'00');ctx.translate(gx,gy);ctx.rotate(-.48+tilt*.2);ctx.scale(1.7,.42);ellipse(0,0,47,47,g);ctx.restore();ctx.save();ctx.globalAlpha=.035;ctx.fillStyle=c.color;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(gx-24,gy);ctx.lineTo(gx+28,gy);ctx.closePath();ctx.fill();ctx.restore()});
// Glass body: a clear silhouette, a heavy base, and reflected window streaks.
const glass=ctx.createLinearGradient(-102,0,102,0);glass.addColorStop(0,'#ffffff77');glass.addColorStop(.12,'#ffffff12');glass.addColorStop(.6,'#f4fffe0a');glass.addColorStop(.89,'#fff9');glass.addColorStop(1,'#b6cbc43b');ctx.beginPath();ctx.moveTo(-70,-107);ctx.bezierCurveTo(-73,-82,-108,-78,-108,-47);ctx.lineTo(-105,97);ctx.bezierCurveTo(-103,132,103,132,105,97);ctx.lineTo(108,-47);ctx.bezierCurveTo(108,-78,73,-82,70,-107);ctx.closePath();ctx.fillStyle=glass;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#ffffffb0';ctx.stroke();ellipse(0,101,103,24,'#e8f0e523','#ffffff80');
visible.map((c,i)=>({c,i,z:Math.cos(i*2.399+rotation)})).sort((a,b)=>a.z-b.z).forEach(({c,i,z})=>{let a=i*2.399+rotation,x=Math.sin(a)*(23+(i%5)*12),y=83-Math.floor(i/7)*22+z*9;if(i===visible.length-1&&fall>0)y-=fall*190;candy(x,y,c.color,Math.sin(i*7+rotation)*.65,.8+z*.13)});
ctx.fillStyle='#ffffff40';ctx.beginPath();ctx.roundRect(-95,-45,8,118,5);ctx.fill();ctx.fillStyle='#ffffff5c';ctx.beginPath();ctx.roundRect(-82,-60,3,70,2);ctx.fill();ctx.fillStyle='#ffffff38';ctx.beginPath();ctx.roundRect(89,-38,5,115,3);ctx.fill();ellipse(0,105,99,20,null,'#ffffff80');ellipse(0,-106,71,17,'#f6fffa24','#ffffffe0');ellipse(0,-104,64,12,null,'#c6d4c96b');
// Ground glass lid, with a tiny round handle.
let lid=ctx.createLinearGradient(0,-133,0,-107);lid.addColorStop(0,'#ffffffe0');lid.addColorStop(1,'#d4dfd383');ellipse(0,-113,77,18,lid,'#ffffffcc');ellipse(0,-118,74,17,'#f7fbf67a','#ffffffc0');ellipse(0,-137,15,10,'#ecf3e8a0','#ffffffc0');ellipse(-3,-140,8,4,'#ffffffb0');
if(!candies.length){ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillStyle='#9c9c8980';ctx.fillText('留一点甜给自己',0,39)}ctx.restore();fall=Math.max(0,fall-.035);requestAnimationFrame(draw)}draw();
})();
</script></body></html>
